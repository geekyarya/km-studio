name: Kiara daily post

on:
  schedule:
    - cron: "17 12 * * *"   # 17:47 IST daily (12:17 UTC) - evening is peak Reels time in India
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run_daily.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          KIARA_LORA_URL: ${{ secrets.KIARA_LORA_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          AUTO_POST: ${{ vars.AUTO_POST }}
      - uses: actions/upload-artifact@v4
        with:
          name: kiara-${{ github.run_id }}
          path: output/
      - name: Save history so ideas never repeat
        run: |
          git config user.name "kiara-bot"
          git config user.email "kiara-bot@users.noreply.github.com"
          git add history.json
          git commit -m "Daily post log" || true
          git push
