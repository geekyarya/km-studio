name: Kiara autopost

on:
  schedule:
    - cron: "35 * * * *"   # every hour at :05 IST - posts whatever slot is due
  workflow_dispatch:
    inputs:
      post_now:
        description: "Publish this many of today's next items immediately (ignores time slots)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: kiara-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run_daily.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          POST_NOW: ${{ github.event.inputs.post_now || '0' }}
      - name: Save state
        if: always()
        run: |
          git config user.name "kiara-bot"
          git config user.email "kiara-bot@users.noreply.github.com"
          git add state/ media/
          git diff --cached --quiet || (git commit -m "autopost $(date -u +%FT%H:%M)" && git pull --rebase && git push)
